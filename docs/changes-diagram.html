<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MacDiskStats design</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7f8;--ink:#18232b;--muted:#526575;--card:#fff;--line:#9bb0bf;--blue:#d9ebf8;--green:#dcefe5;--orange:#f8e7d2;--border:#5a8199}
@media(prefers-color-scheme:dark){:root{--bg:#121b22;--ink:#edf4f6;--muted:#acc0cb;--card:#1d2a33;--line:#7293a6;--blue:#25475d;--green:#25483b;--orange:#60432d;--border:#95bdd2}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:38px 24px 52px}h1{font-size:clamp(26px,4vw,42px);line-height:1.1;margin:0 0 10px}p{color:var(--muted);margin:0 0 24px;max-width:75ch}svg{display:block;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 38px #0002}text{font:16px system-ui,sans-serif;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.title{font-size:19px;font-weight:700}.line{stroke:var(--border);stroke-width:2;fill:none;marker-end:url(#arrow)}.boundary{stroke:var(--border);stroke-width:2;stroke-dasharray:9 7;fill:none}.box{stroke:var(--line);stroke-width:1.5;rx:12}.blue{fill:var(--blue)}.green{fill:var(--green)}.orange{fill:var(--orange)}.map{fill:#527f9c}.map2{fill:#81a9ba}.map3{fill:#72a88d}.map4{fill:#cba16d}
</style>
<main><h1>How MacDiskStats reads a disk</h1><p>Metadata moves from the disk into a flat tree. The map, file tree, file types, and status line read that same tree. The app cannot change scanned files.</p>
<svg viewBox="0 0 1160 700" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">MacDiskStats design</title><desc id="diagram-desc">Disk metadata enters two scanner phases, then a flat tree, treemap layout, cushion shading, and the four window views. A read-only sandbox encloses the app.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--border)"/></marker></defs>
<rect class="boundary" x="150" y="50" width="970" height="610" rx="24"/><text class="title" x="177" y="83">Read-only app sandbox</text><text class="small" x="177" y="106">File metadata enters. No delete, move, rename, or file-content write leaves.</text>
<rect class="box orange" x="24" y="262" width="112" height="100"/><text class="title" x="44" y="305">Disk</text><text class="small" x="43" y="330">metadata</text>
<path class="line" d="M136 312H187"/><rect class="box blue" x="188" y="249" width="185" height="126"/><text class="title" x="209" y="279">Scanner</text><text x="209" y="308">1. fast walk</text><text x="209" y="335">2. shared files</text><text class="small" x="209" y="356">cancel in either phase</text>
<path class="line" d="M373 312H421"/><rect class="box green" x="422" y="250" width="176" height="125"/><text class="title" x="443" y="282">Flat tree</text><text x="443" y="312">node IDs + arrays</text><text class="small" x="443" y="341">sizes, paths, types</text>
<path class="line" d="M598 312H638"/><rect class="box blue" x="639" y="250" width="180" height="125"/><text class="title" x="659" y="282">Treemap layout</text><text x="659" y="311">nested boxes</text><text class="small" x="659" y="340">area = disk use</text>
<path class="line" d="M819 312H858"/><rect class="box orange" x="859" y="250" width="194" height="125"/><text class="title" x="878" y="282">Cushion shading</text><text x="878" y="311">pixels by file type</text><text class="small" x="878" y="340">highlight keeps layout</text>
<path class="line" d="M955 375V420"/><rect class="box blue" x="830" y="421" width="223" height="187"/><text class="title" x="851" y="451">Map</text><rect class="map" x="852" y="470" width="93" height="100"/><rect class="map2" x="948" y="470" width="83" height="59"/><rect class="map3" x="948" y="532" width="47" height="38"/><rect class="map4" x="998" y="532" width="33" height="38"/><text class="small" x="852" y="594">click · hover · zoom</text>
<path class="line" d="M510 375V422"/><path class="line" d="M510 401H253V423"/><path class="line" d="M510 401H548V423"/><rect class="box green" x="188" y="424" width="233" height="184"/><text class="title" x="209" y="455">Tree</text><text x="209" y="488">folders and files</text><text x="209" y="519">size · Frees · %</text><text class="small" x="209" y="567">one selected node</text><rect class="box green" x="446" y="424" width="232" height="184"/><text class="title" x="467" y="455">Types</text><text x="467" y="488">extension totals</text><text class="small" x="467" y="567">one highlighted type</text>
<path class="line" d="M598 306H624V169H640"/><rect class="box orange" x="641" y="123" width="412" height="91"/><text class="title" x="662" y="154">Status line</text><text x="662" y="183">scan progress · selection · unreadable folders</text>
<text class="small" x="185" y="642">Finder receives a selected URL only when the user chooses Reveal.</text>
</svg></main></html>
